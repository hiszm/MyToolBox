name: 🐛 Bug report
description: Report a bug in MyToolBox or one of its tools
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below so we can reproduce it quickly.

  - type: dropdown
    id: tool
    attributes:
      label: Which tool is affected?
      description: Or select "Site / framework" if the issue is not tool-specific.
      options:
        - Site / framework (homepage, routing, theme, etc.)
        - Text Convert
        - Number to Chinese
        - Timestamp Formatter
        - Base64
        - URL Encode
        - JWT Decoder
        - UUID Generator
        - Hash Calculator
        - QR Code Generator
        - Color Converter
        - JSON Formatter
        - Code Formatter
        - Regex Tester
        - Document Diff
        - Word Cloud
        - Set Calculator
        - Hive Incremental Merge
        - Table Data Diff
        - Contact (vCard) Builder
        - Duty Schedule
        - Life Progress
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what went wrong.
      placeholder: I clicked X, expected Y, but instead got Z.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the bug.
      placeholder: |
        1. Go to /tools/json
        2. Paste the input below
        3. Click "Format"
        4. See error message
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Input data (if applicable)
      description: The exact input that triggers the bug. Use a code block for formatting.
      render: text
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome 124, Firefox 125, Safari 17.4
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. macOS 14.4, Windows 11, Ubuntu 24.04, iOS 17.5
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I checked that no existing issue describes this bug
          required: true
        - label: I tried reproducing in an incognito / private window
          required: false
