name: ✨ Feature request
description: Suggest a new tool or improvement to an existing one
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before filing, please remember the three rules for new tools:
        1. **Local-only** — no backend or third-party APIs
        2. **Single-purpose** — one tool, one problem
        3. **Bilingual** — zh/en support

  - type: dropdown
    id: kind
    attributes:
      label: Kind of request
      options:
        - New tool
        - Enhancement to an existing tool
        - Site / framework improvement
        - Documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What's painful today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would the ideal tool/feature look like? Be specific about inputs, outputs, UI.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools / approaches you've tried and why they fell short.
    validations:
      required: false

  - type: checkboxes
    id: rules
    attributes:
      label: Three rules check
      description: Tools that don't satisfy these will not be merged
      options:
        - label: Can be implemented fully in the browser, no backend
        - label: Has a single, clearly-defined purpose
        - label: Translatable to both 中文 and English
